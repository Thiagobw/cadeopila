spring.datasource.url=jdbc:h2:mem:transactions_testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

# URLs fictícias só para satisfazer o @NotBlank do AppProperties quando um
# @SpringBootTest carrega o contexto; nenhum teste chama as APIs reais.
app.account.base-url=http://localhost/mock-accounts
app.user.base-url=http://localhost/mock-user
app.exchange.base-url=http://localhost/mock-exchange
app.exchange.currencies=USD,EUR
app.time-zone=America/Sao_Paulo
app.http.connect-timeout=2s
app.http.read-timeout=3s
