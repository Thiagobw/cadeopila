spring.application.name=transaction-service
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transactions_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.flywaydb=INFO

# Actuator: expõe apenas /actuator/health (consumido pelo Docker healthcheck). O MockApiHealthIndicator
# contribui para esse status; detalhes dos componentes não são revelados ao chamador anônimo (a URL da
# MockAPI carrega token sensível e nunca deve vazar no corpo do health).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Integrações externas — URLs base (o adapter acrescenta o caminho do recurso)
# ACCOUNT_API_BASE_URL sem default: a aplicação não sobe sem ela (ver AppProperties)
app.account.base-url=${ACCOUNT_API_BASE_URL:}
# user-service (MS1) — validação de credenciais do Basic Auth (autenticação)
app.user.base-url=${USER_API_BASE_URL:http://localhost:8081}
# Comunicação M2M: chave enviada no header X-Internal-Key ao chamar o endpoint interno do MS1
app.user.internal-api-key=${INTERNAL_API_KEY:}
app.exchange.base-url=${EXCHANGE_API_BASE_URL:https://brasilapi.com.br/api}
app.exchange.currencies=USD,EUR
# Câmbio é best-effort e pode encadear chamadas (moedas × lookback): read-timeout curto evita somar
# segundos ao caminho da transação quando a BrasilAPI está lenta (D8). A conexão continua em app.http.
app.exchange.read-timeout=${EXCHANGE_READ_TIMEOUT:1s}
app.time-zone=America/Sao_Paulo
app.http.connect-timeout=2s
app.http.read-timeout=3s
