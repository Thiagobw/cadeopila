spring.application.name=user-service
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/users_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.flywaydb=INFO

# Actuator: expõe apenas /actuator/health (consumido pelo Docker healthcheck); nada mais fica público
# e os detalhes dos componentes não são revelados ao chamador anônimo.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Comunicação M2M: chave exigida no header X-Internal-Key do endpoint interno /api/v1/auth/validate
app.internal-api.key=${INTERNAL_API_KEY:}
